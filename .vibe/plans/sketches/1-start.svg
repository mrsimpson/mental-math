<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" width="360" height="520" role="img" font-family="sans-serif" font-size="14">
<title>Skizze Startseite: Einstellungen für eine Runde</title>
<rect width="360" height="520" fill="#f6f4ff"/>
<text x="20" y="40" font-size="24" font-weight="bold">Kopfrechnen</text>
<text x="20" y="64" font-size="13">Übe Rechnen im Kopf. Die Stoppuhr misst deine Zeit.</text>
<text x="20" y="100" font-weight="bold">Rechenart</text>
<rect x="20" y="108" width="75" height="40" rx="8" fill="#5b4bd6"/><text x="46" y="133" fill="#fff">+ Plus</text>
<rect x="100" y="108" width="75" height="40" rx="8" fill="#fff" stroke="#5b4bd6"/><text x="120" y="133">− Minus</text>
<rect x="180" y="108" width="75" height="40" rx="8" fill="#fff" stroke="#5b4bd6"/><text x="204" y="133">· Mal</text>
<rect x="260" y="108" width="80" height="40" rx="8" fill="#fff" stroke="#5b4bd6"/><text x="272" y="133">: Geteilt</text>
<text x="20" y="180" font-weight="bold">Zahlenraum</text>
<rect x="20" y="188" width="150" height="40" rx="8" fill="#5b4bd6"/><text x="52" y="213" fill="#fff">bis 100</text>
<rect x="180" y="188" width="150" height="40" rx="8" fill="#fff" stroke="#5b4bd6"/><text x="212" y="213">bis 1000</text>
<text x="20" y="260" font-weight="bold">Anzahl Aufgaben: 10</text>
<text x="20" y="290" font-weight="bold">Anzahl Summanden: 2</text>
<text x="20" y="320" font-weight="bold">Antwort: Auswahl | Eingabe</text><text x="20" y="344" font-weight="bold">Stoppuhr: an | aus</text>
<rect x="20" y="372" width="320" height="52" rx="12" fill="#e8590c"/><text x="130" y="404" font-size="18" fill="#fff" font-weight="bold">Los geht's!</text>
<text x="20" y="450" font-size="12">Alles auch mit Tastatur: Tab, Pfeile, Enter.</text>
</svg>
