<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" width="360" height="520" role="img" font-family="sans-serif" font-size="14">
<title>Skizze Ende: Ergebnis mit Zeit und Fehlversuchen</title>
<rect width="360" height="520" fill="#f6f4ff"/>
<text x="20" y="50" font-size="26" font-weight="bold">Geschafft! 🎉</text>
<text x="20" y="100" font-size="18">10 von 10 Aufgaben gelöst</text>
<text x="20" y="135" font-size="18">Zeit: 3:12 Minuten (nur wenn Stoppuhr an)</text>
<text x="20" y="170" font-size="18">Fehlversuche: 4</text>
