<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" width="360" height="520" role="img" font-family="sans-serif" font-size="14">
<title>Skizze Aufgabe: Rechenaufgabe mit Stoppuhr und Fehlversuchen</title>
<rect width="360" height="520" fill="#f6f4ff"/>
<text x="20" y="34">Aufgabe 3 von 10</text><text x="230" y="34"></text>
<text x="20" y="58" fill="#c92a2a">Fehlversuche: 1</text>
<rect x="20" y="80" width="320" height="90" rx="14" fill="#fff" stroke="#5b4bd6"/>
<text x="60" y="138" font-size="34" font-weight="bold">47 + 8 + 15 = ?</text>
<rect x="20" y="190" width="150" height="50" rx="10" fill="#fff" stroke="#5b4bd6"/><text x="75" y="222">60</text>
<rect x="190" y="190" width="150" height="50" rx="10" fill="#fff" stroke="#5b4bd6"/><text x="245" y="222">70</text>
<rect x="20" y="250" width="150" height="50" rx="10" fill="#fff" stroke="#5b4bd6"/><text x="75" y="282">80</text>
<rect x="190" y="250" width="150" height="50" rx="10" fill="#fff" stroke="#5b4bd6"/><text x="245" y="282">65</text>
<text x="20" y="335" font-size="12">(Bei Eingabe: Zahlenfeld + Prüfen statt der vier Karten.)</text>
<rect x="20" y="350" width="320" height="70" rx="10" fill="#fff4e6" stroke="#e8590c"/>
<text x="30" y="376">Fast! Beim Zehnerübergang: 47 + 3 = 50,</text><text x="30" y="396">dann + 5 = 55, dann + 15 = 70.</text>
</svg>
