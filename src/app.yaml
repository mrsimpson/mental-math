# yaml-language-server: $schema=../node_modules/@lernapps/app-templates/runtime/interactive/interactive.v1.schema.json
title: Kopfrechnen
description: |
  Du übst Kopfrechnen mit Plus, Minus, Mal und Geteilt, für Klasse 3 und 4.
  Du wählst die Rechenart, den Zahlenraum bis 100 oder bis 1000, die Anzahl der Aufgaben und der Summanden.
  Dann rechnest du im Kopf und gibst das Ergebnis an: durch Auswählen oder durch Eintippen.
howto: |
  - Wähle die Einstellungen und drücke „Los geht's!“.
  - Rechne die Aufgabe im Kopf. Wähle das Ergebnis aus den vier Zahlen oder tippe es ein.
  - Ist das Ergebnis falsch, bekommst du einen Tipp und einen Fehlversuch. Nach drei Fehlversuchen zeigt dir die App den Rechenweg.
  - Die Stoppuhr misst deine Zeit, wenn du sie einschaltest. Es gibt kein Zeitlimit.
  - Am Ende siehst du deine Fehlversuche und deine Zeit.
competencies:
  - Ich kann Zahlen mit 2 bis 4 Summanden im Zahlenraum bis 100 im Kopf addieren.
  - Ich kann Zahlen mit 2 bis 4 Summanden im Zahlenraum bis 1000 im Kopf addieren.
  - Ich kann im Zahlenraum bis 100 im Kopf subtrahieren.
  - Ich kann im Zahlenraum bis 1000 im Kopf subtrahieren.
  - Ich kann Aufgaben des kleinen Einmaleins im Kopf berechnen.
  - Ich kann Einmaleins-Aufgaben auf Zehner- und Hunderterzahlen übertragen und berechnen.
  - Ich kann Divisionsaufgaben des kleinen Einmaleins ohne Rest berechnen, indem ich die Umkehraufgabe nutze.
  - Ich kann Divisionsaufgaben mit Zehner- und Hunderterzahlen berechnen.
languages: [de]
routes:
  - id: gemischt
    title: Alle Rechenarten
    description: Plus, Minus, Mal und Geteilt gemischt
  - id: plus
    title: Plus
    description: Zusammenzählen mit 2 bis 4 Summanden
  - id: minus
    title: Minus
    description: Abziehen
  - id: mal
    title: Mal
    description: Das kleine Einmaleins und Zehner und Hunderter
  - id: geteilt
    title: Geteilt
    description: Teilen ohne Rest, mit der Umkehraufgabe
sections:
  - id: umkehraufgabe
    title: Mit der Umkehraufgabe prüfen
    text: |
      Bei Plus und Minus, Mal und Geteilt gehören Aufgaben zusammen: Wenn 6 · 7 = 42 ist, dann ist 42 : 6 = 7.
      So kannst du jedes Ergebnis kontrollieren.
