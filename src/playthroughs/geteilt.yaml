# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/interactive/playthrough.v1.schema.json
# A round of Geteilt without the stopwatch (12 : 6, 56 : 7, 18 : 6, 12 : 6, 6 : 3): time does not count, an answer
# that is no whole number is ignored, the last operation cannot be switched off, and the answers 2, 8, 3, 2 and 2 end the round.
route: geteilt
seed: 1
steps:
  - inputs:
      - { kind: action, name: toggle-op, value: plus }
      - { kind: action, name: toggle-op, value: plus }
      - { kind: action, name: toggle-op, value: geteilt }
      - { kind: action, name: set-timer, value: false }
      - { kind: action, name: set-count, value: 5 }
    state: { phase: setup, settings: { ops: [geteilt], range: 100, count: 5, terms: 2, mode: choice, timer: false } }
  - inputs: [{ kind: action, name: begin }]
    state: { phase: playing, index: 0 }
  - ticks: 100
    state: { elapsed: 0 }
  - inputs:
      - { kind: action, name: answer, value: "abc" }
      - { kind: action, name: answer, value: "" }
      - { kind: action, name: answer, value: 2.5 }
    state: { index: 0, failures: 0 }
  - inputs: [{ kind: action, name: answer, value: 6 }]
    state: { failures: 1, last: wrong, mistake: minus }
  - inputs:
      - { kind: action, name: answer, value: 2 }
      - { kind: action, name: answer, value: 8 }
      - { kind: action, name: answer, value: 3 }
      - { kind: action, name: answer, value: 2 }
      - { kind: action, name: answer, value: 2 }
    state: { phase: done, index: 5, failures: 1, elapsed: 0 }
